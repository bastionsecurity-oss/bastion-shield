<!doctype html>
<!--
  Bastion Shield — expanded popup view (760×560). Same app as the dashboard
  (dashboard.js), in popup mode: «Diese Website» first, the collapse button
  returns to the compact popup, and sections where closing the popup would
  lose work (Eigene Filter) open the dashboard in a tab instead (↗).
  panel.html?tabId=<n>#site — the tab id comes from the compact popup.
  SPDX-FileCopyrightText: 2026 Bastion Security GmbH and contributors
  SPDX-License-Identifier: GPL-3.0-or-later
-->
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#171C1E" media="(prefers-color-scheme: dark)">
  <title data-i18n="dashTitle">Bastion Shield</title>
  <link rel="preload" href="shared/fonts/inter-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="shared/fonts/inter-tight-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="shared/tokens.css">
  <link rel="stylesheet" href="dashboard.css">
  <!-- Render-blocking: the first frame is the drawn view, so the morph from the compact popup has a target. -->
  <script src="dashboard.js" defer blocking="render"></script>
  <link rel="prefetch" href="popup.css">
  <link rel="prefetch" href="popup.js">
</head>
<body class="db db--popup" data-view="">
  <div class="db-shell">
    <nav class="db-nav" data-i18n-aria-label="dashNavLabel" aria-label="Bereiche">
      <div class="db-nav__top">
        <button type="button" class="db-nav__collapse" id="db-collapse"><span data-icon="collapse" data-icon-size="16" aria-hidden="true"></span><span class="db-nav__collapse-label" data-i18n="panelCollapse">Verkleinern</span></button>
      </div>
      <ul class="db-nav__list" id="db-nav-list">
        <li class="db-nav__site"><a class="db-nav__link" href="#site" data-view="site"><span class="db-nav__tile" aria-hidden="true"><span data-icon="privacy"></span></span><span class="db-nav__label" data-i18n="navSite">Diese Website</span></a></li>
        <li class="db-nav__sep" role="presentation"></li>
        <li><a class="db-nav__link" href="#overview" data-view="overview"><span class="db-nav__tile" aria-hidden="true"><span data-icon="overview"></span></span><span class="db-nav__label" data-i18n="navOverview">Übersicht</span></a></li>
        <li><a class="db-nav__link" href="#activity" data-view="activity"><span class="db-nav__tile" aria-hidden="true"><span data-icon="activity"></span></span><span class="db-nav__label" data-i18n="navActivity">Aktivität</span></a></li>
        <li><a class="db-nav__link" href="#lists" data-view="lists"><span class="db-nav__tile" aria-hidden="true"><span data-icon="lists"></span></span><span class="db-nav__label" data-i18n="navLists">Filterlisten</span></a></li>
        <li><a class="db-nav__link" href="#filters" data-view="filters" data-open-tab="filters"><span class="db-nav__tile" aria-hidden="true"><span data-icon="filters"></span></span><span class="db-nav__label" data-i18n="navFilters">Eigene Filter</span><span class="db-nav__ext" aria-hidden="true"><span data-icon="openTab" data-icon-size="12"></span></span></a></li>
        <li><a class="db-nav__link" href="#sites" data-view="sites"><span class="db-nav__tile" aria-hidden="true"><span data-icon="sites"></span></span><span class="db-nav__label" data-i18n="navSites">Website-Ausnahmen</span></a></li>
        <li><a class="db-nav__link" href="#privacy" data-view="privacy"><span class="db-nav__tile" aria-hidden="true"><span data-icon="lock"></span></span><span class="db-nav__label" data-i18n="navPrivacy">Datenschutz</span></a></li>
        <li><a class="db-nav__link" href="#settings" data-view="settings"><span class="db-nav__tile" aria-hidden="true"><span data-icon="settings"></span></span><span class="db-nav__label" data-i18n="navSettings">Einstellungen</span></a></li>
        <li><a class="db-nav__link" href="#about" data-view="about"><span class="db-nav__tile" aria-hidden="true"><span data-icon="info"></span></span><span class="db-nav__label" data-i18n="navAbout">Über</span></a></li>
        <li id="db-nav-lab" class="db-nav__lab" hidden><a class="db-nav__link" href="#lab" data-view="lab" data-open-tab="lab"><span class="db-nav__tile" aria-hidden="true"><span data-icon="lab"></span></span><span class="db-nav__label" data-i18n="nerdLabNav">Entwicklertools</span><span class="db-nav__ext" aria-hidden="true"><span data-icon="openTab" data-icon-size="12"></span></span></a></li>
      </ul>
      <a class="db-nav__dash" href="dashboard.html#overview" data-open-tab="overview"><span class="db-nav__dash-label" data-i18n="panelOpenDashboard">Dashboard öffnen</span><span aria-hidden="true"><span data-icon="openTab" data-icon-size="12"></span></span></a>
      <div class="db-nav__foot" id="db-nav-foot"></div>
    </nav>

    <main class="db-main" id="db-main" tabindex="-1">
      <div class="db-view" id="db-view" aria-busy="true"></div>
    </main>
  </div>
</body>
</html>
