# Bastion Shield CI: type-check, unit tests, policy checks, full build with the
# real filter lists (build -> validate in Chromium -> offline rebuild), and
# end-to-end tests in headless Chromium. The unpacked
# build is the strict validator: Chromium refuses to load an unpacked
# extension with an invalid static DNR rule, so a green e2e run means every
# shipped rule is valid.
#
# SPDX-FileCopyrightText: 2026 Bastion Security GmbH and contributors
# SPDX-License-Identifier: GPL-3.0-or-later

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  # Playwright keeps its browsers here so the cache step can find them.
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright

jobs:
  checks:
    name: Type-check, unit tests, policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Type-check CI scripts
        run: npx tsc -p .github/scripts

      - name: Unit tests
        run: npm test

      - name: Managed policy schema and examples
        run: node .github/scripts/check-policy.ts

      - name: PowerShell scripts parse
        shell: pwsh
        run: |
          $failed = $false
          foreach ($f in @(Get-ChildItem policy/examples/*.ps1) + @(Get-ChildItem .github/scripts/*.ps1)) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            foreach ($e in $errors) { Write-Host "::error file=$($f.Name),line=$($e.Extent.StartLineNumber)::$($e.Message)"; $failed = $true }
          }
          if ($failed) { exit 1 }

  build:
    name: Build and e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Raw filter lists are cached between runs; tools/fetch-lists.ts revalidates
      # them with ETag, so an unchanged list costs a 304 instead of a download.
      # .cache/regex-unsupported.json (written by `npm run validate`) carries the
      # regexes Chromium's RE2 rejected over to the next run.
      - name: Restore filter list cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/lists
            .cache/regex-unsupported.json
          key: filter-lists-${{ hashFiles('filters/catalog.json') }}-${{ github.run_id }}
          restore-keys: |
            filter-lists-${{ hashFiles('filters/catalog.json') }}-
            filter-lists-

      # The validate pass below needs Chromium, so install it before building.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Two passes. Chromium's RE2 memory limit can only be checked in a browser:
      # `npm run validate` loads the first build and records the regexes Chromium
      # rejects in .cache/regex-unsupported.json. The offline rebuild then reads
      # that file and the lists the first pass fetched, so it drops exactly those
      # regexes from the same inputs. validate exits non-zero on real problems
      # (rulesets not enabled, invalid selectors, rejected registrations).
      - name: Build
        run: |
          npm run build
          xvfb-run --auto-servernum npm run validate
          node tools/build.ts --offline

      - name: Rule budget of the default lists
        run: node .github/scripts/check-budget.ts dist

      - name: Package (store zips)
        run: npm run package

      - name: Build report summary
        if: always()
        run: |
          if [ -f dist/build-report.json ]; then
            {
              echo '### Build report'
              echo '```json'
              head -c 60000 dist/build-report.json
              echo
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload build report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-report
          path: |
            dist/build-report.json
            filters/lock.json
          if-no-files-found: warn
          retention-days: 30

      # Extensions need a real (or virtual) display unless the test runner uses
      # Chromium's new headless mode; xvfb-run makes both setups work.
      - name: End-to-end tests
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload extension build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bastion-shield-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Upload store packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bastion-shield-packages
          path: dist-pkg/*.zip
          if-no-files-found: error
          retention-days: 14
